{% extends "base.html" %}
{% block content %}

<h3 class="text-center mb-4">Dashboard Statistik Prediksi</h3>

<div class="card shadow border-0 p-4 mb-4">
    <canvas id="chartPrediksi"></canvas>
</div>

<div class="text-center">
    <a href="/" class="btn btn-outline-success btn-lg">
        ⬅ Kembali ke Halaman Deteksi
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
(function () {
    const chartLabels = {{ labels | tojson }};
    const chartCounts = {{ counts | tojson }};

    const ctx = document.getElementById('chartPrediksi').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: chartLabels,
            datasets: [{
                label: 'Jumlah Prediksi',
                data: chartCounts,
                backgroundColor: 'rgba(25, 135, 84, 0.7)'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true
                }
            }
        }
    });
})();
</script>

{% endblock %}
