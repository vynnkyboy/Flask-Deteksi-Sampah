{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0">
            <div class="card-body text-center p-4">

                <h4>Hasil Deteksi</h4>

                <img src="{{ image_path }}" class="img-fluid rounded mb-3" style="max-height:300px">

                <h3 class="fw-bold">{{ label }}</h3>

                <p>Tingkat Kepercayaan Model</p>
                <div class="progress mb-3" style="height:25px;">
                    <div class="progress-bar bg-success" style="width: {{ confidence }}%;">
                        {{ confidence }}%
                    </div>
                </div>

                <h5>Visualisasi Fokus Model (Grad-CAM)</h5>
                <img src="{{ heatmap_path }}" class="img-fluid rounded shadow mb-3">

                <a href="/" class="btn btn-outline-success">⬅ Deteksi Ulang</a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
